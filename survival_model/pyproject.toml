[project]
name = "survival-model"
version = "0.1.0"
authors = [
    { name = "Jakub Pekár", email = "jakubpekar@mail.muni.cz" },
]
requires-python = ">=3.12,<3.14"
dependencies = [
    "hydra-core>=1.3.2",
    "joblib>=1.3.0",
    "lifelines>=0.30.0",
    "matplotlib>=3.9.0",
    "mlflow>=3.14.0",
    "numpy>=2.0.0",
    "omegaconf>=2.3.0",
    "openpyxl>=3.1.0",
    "pandas>=2.0.0",
    "pyarrow>=17.0.0",
    "rationai-mlkit",
    "scikit-learn>=1.6.0",
    "scikit-survival>=0.25.0",
    "xlrd>=2.0.0",
]

[dependency-groups]
dev = ["mypy", "ruff"]
run = [
    "rationai-kube-jobs",
]

[tool.uv.sources]
rationai-mlkit = { git = "https://gitlab.ics.muni.cz/rationai/digital-pathology/libraries/mlkit.git" }
rationai-kube-jobs = { git = "ssh://git@gitlab.ics.muni.cz/rationai/infrastructure/kube-jobs" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
