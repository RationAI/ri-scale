# @package _global_

dataset:
  institute: mug
  name: MUG
  path: ???   # mug_lymph_nodes_filtered_rev1_patients.csv (one row per patient, overall survival)

  # Patients with any of these review flags are left out. clinical_context_review_flag marks a
  # recurrence, prior treatment, multiple tumours, an unusual site / histology or an uncertain origin.
  exclude_flags: [clinical_context_review_flag]

  # TNM and age describe the examination, but survival runs from the first diagnosis, so a patient
  # examined later had to survive until then (immortal time). Patients examined more than this many
  # days after the diagnosis are left out; null keeps everyone. The examination_delay_days/* metrics
  # show the distribution.
  max_examination_delay_days: 365

  # Patients diagnosed before this year are left out; null keeps everyone. MUG starts around 1980
  # (follow-up cut off in 2018) and MMCI is from 2015-2016, while surgery, chemotherapy and the TNM
  # editions changed in between. The era/* metrics show survival per decade of diagnosis.
  min_diagnosis_year: null
